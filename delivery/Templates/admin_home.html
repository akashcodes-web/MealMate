<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="{% static 'admin.css' %}">
</head>
<body>

    <a href="{% url 'logout' %}" class="log">
        <i class="fa-duotone fa-solid fa-arrow-right-from-bracket"></i>
    </a>

    <div class="row">
        <div class="head">
            <h3>welcome to Admin Home</h3>
        </div>
        <div class="slider">
            <img src="{%static 'images/admin1.png'%}">
            <img src="{%static 'images/admin2.png'%}">
        </div>
        <div class="sign">
            <a href="open_add_restaurant">ADD NEW RESTURANT</a>
            <a href="open_show_restaurants">SHOW RESTAURANTS</a>
        </div>
        <br><br><br>
    </div>
</body>
{% if messages %}
<script>
    {% for message in messages %}
        alert("{{ message }}");
    {% endfor %}
</script>
{% endif %}
</html>
