<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Restaurant</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'update_restaurant.css' %}">
</head>
<body>
    <form action="{% url 'update_restaurant' restaurant.id %}" method="POST">
        {% csrf_token %}
        <label>Restaurant Name</label>
        <input type="text" name="name" value="{{restaurant.name}}">
        <br><br>
        <label>Picture url</label>
        <input type="text" name="picture" value="{{restaurant.picture}}">
        <br><br>
        <label>Cuisine</label>
        <input type="text" name="cuisine" value="{{restaurant.cuisine}}">
        <br><br>
        <label>Rating</label>
        <input type="number" name="rating" min="0" max="5" step="0.1" value="{{restaurant.rating}}">
        <br><br>
        <button type="submit">Update Restaurant</button>
    </form>
</body>
</html>
